<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Documents</title>
    <link rel="stylesheet" href="css/style.css">
</head>
    <script src="script.js"></script>
    <body>
        <header>
            <h1>🤖 AI</h1>
            <p>Research, summarize and analyze.</p>
        </header>

        <main>
            <section class="upload">
                <h2>Upload Document</h2>
                <p>PDF, Word or Text</p>
                <input label = "file" type="file" >
                <button>OK</button>

            </section>

            <section class="cards">
                <div class="card">
                    <h3>Summarize </h3>
                    <p>Create an automatic summary.</p>
                </div>

                <div class="card">
                    <h3>🔍 Research</h3>
                    <p>Find information.</p>
                </div>

                <div class="card">
                    <h3>📊 Generate report</h3>
                    <p>Generate reports in seconds.</p>
                </div>

                <div class="card">
                    <h3>✅ Recommend tasks</h3>
                    <p>Suggestions based on documents.</p>
                </div>
            </section>

            <section class="chat">
                <h2>Ask IA</h2>
                <textarea placeholder="Ex: Qual é o prazo deste contrato?"></textarea>
                <button>Ask</button>
            </section>

        </main>

        <footer>Site created by Daniela Mota</footer>
    </body>
</html>
